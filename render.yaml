services:
  - type: web
    name: portfolio-kaza
    env: node
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DB_PATH
        value: /var/data/portfolio.db
